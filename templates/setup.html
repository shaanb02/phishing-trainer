<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initial Setup — Cybersecurity Training</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body { background-color: #0d1117; }
        .setup-card { max-width: 460px; width: 100%; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="setup-card px-3">
        <div class="text-center mb-4">
            <i data-feather="settings" style="font-size:3rem;color:#198754;" class="mb-3"></i>
            <h1 class="h3 text-light fw-bold">First-Time Setup</h1>
            <p class="text-muted">Create your administrator account to get started.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card border-secondary">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('setup') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Choose a username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="admin@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="At least 8 characters" required minlength="8">
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               placeholder="Repeat your password" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i data-feather="check-circle" class="me-2" style="width:16px;height:16px;"></i>Create Admin Account
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>feather.replace();</script>
</body>
</html>
