<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Cybersecurity Training</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body { background-color: #0d1117; }
        .login-card {
            max-width: 420px;
            width: 100%;
        }
        .brand-icon { font-size: 3rem; color: #0d6efd; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-card px-3">
        <div class="text-center mb-4">
            <i data-feather="shield" class="brand-icon mb-3"></i>
            <h1 class="h3 text-light fw-bold">Cybersecurity Training</h1>
            <p class="text-muted">Admin Dashboard — Sign In</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card border-secondary">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i data-feather="user" style="width:16px;height:16px;"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Enter username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i data-feather="lock" style="width:16px;height:16px;"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i data-feather="log-in" class="me-2" style="width:16px;height:16px;"></i>Sign In
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center text-muted small mt-4">
            <i data-feather="lock" style="width:12px;height:12px;" class="me-1"></i>
            Access restricted to authorized administrators only.
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>feather.replace();</script>
</body>
</html>
